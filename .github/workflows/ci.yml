name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check shared/ api/ ingestion/

      - name: Test
        run: pytest shared/ -v --no-header || [ $? -eq 5 ]